name: Nightly Release

on:
  schedule:
    # Runs at 2:00 AM UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:  # Allow manual trigger

permissions: {}

jobs:
  release-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Fork note: upstream also pushes to Docker Hub with DOCKERHUB_USERNAME/DOCKERHUB_TOKEN,
      # which are not available on this fork. Images go to this fork's GHCR only.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build frontend
        # The Dockerfile COPYs the prebuilt frontend-dist; the frontend/ dir is dockerignored
        run: |
          npm clean-install --no-fund
          npm run build:frontend

      - name: Build and push nightly image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: nightly
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dockge:nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max
