name: Docker Release (fork)

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag (e.g. 1.4.2 or beta). "latest" is always pushed.'
        required: false
        default: ''

# Push images to this fork's own GHCR: ghcr.io/ariakeumi/dockge
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dockge

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        run: |
          tags="${IMAGE}:latest"
          # master builds get a rolling "master" tag; manual runs may add an extra tag
          if [ "${{ github.event_name }}" = "push" ]; then
            tags="$tags ${IMAGE}:master"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            tags="$tags ${IMAGE}:${{ github.event.inputs.tag }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        # The Dockerfile COPYs the prebuilt frontend-dist; the frontend/ dir is dockerignored
        run: |
          npm clean-install --no-fund
          npm run build:frontend

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
